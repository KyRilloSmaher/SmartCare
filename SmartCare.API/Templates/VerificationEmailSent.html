<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Email Sent</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #28a745; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; padding: 20px; border-radius: 5px; }
        .email { font-weight: bold; color: #155724; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Verification Email Sent ✅</h1>
        <div class="success">
            <p>A new verification email has been sent to <span class="email">{{{email}}}</span>.</p>
            <p>Please check your inbox and follow the instructions to confirm your email address.</p>
        </div>
    </div>
</body>
</html>
