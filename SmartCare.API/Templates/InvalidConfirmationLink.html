<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invalid Confirmation Link</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #dc3545; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; padding: 20px; border-radius: 5px; }
        .resend-btn {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
        }
        .resend-btn:hover { background: #0056b3; }
        .link-container {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            word-break: break-all;
            text-align: left;
        }
        code { font-family: monospace; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Invalid or Expired Link ❌</h1>
        <div class="error">
            <p>The confirmation link is invalid or has expired.</p>
        </div>
        <a href="{{{resendLink}}}" class="resend-btn">Request New Verification Email</a>
        <div class="link-container">
            <p style="margin: 0; font-size: 14px; color: #666;">Or copy this link:</p>
            <code>{{{resendLink}}}</code>
        </div>
    </div>
</body>
</html>
